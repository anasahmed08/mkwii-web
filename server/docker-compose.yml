services:
  translate:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "8787:8787"
      - "8788:8788"
    volumes:
      - ../vendor/wiicompiled:/vendor/wiicompiled:ro
      - ../vendor/aurora:/vendor/aurora:ro
      - translate-work:/work
      - ../public/wasm:/app/public/wasm
      - E:/:/iso:ro
    environment:
      PORT: 8787
      NET_PORT: 8788
      CLEAR_ON_START: "1"
volumes:
  translate-work: